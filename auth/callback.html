<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth callback · SA247</title>
  <link rel="stylesheet" href="../assets/site.css?v=20260926google" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js?v=20260926google" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đang xác thực…</h1>
    <p class="lead" id="msg">Vui lòng chờ trong giây lát.</p>
  </main>
  <script>
    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function pickDisplayName(user) {
      const meta = user?.user_metadata || {};
      return (
        meta.full_name ||
        meta.name ||
        [meta.given_name, meta.family_name].filter(Boolean).join(" ") ||
        ""
      ).trim();
    }

    async function syncGoogleProfile(session) {
      try {
        const user = session?.user;
        if (!user?.id) return;
        const name = pickDisplayName(user);
        if (!name) return;
        const profile = await sa247Auth.getProfile({ session, timeoutMs: 1200 });
        if (profile?.full_name && String(profile.full_name).trim()) return;
        await sa247Auth.updateProfile({ full_name: name });
      } catch (e) {
        console.warn("[SA247] syncGoogleProfile", e);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const msg = document.getElementById("msg");
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Thiếu supabase config.";
        return;
      }

      const sb = await sa247Auth.ensureClient();
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      let next = params.get("next") || hash.get("next");
      try {
        if (!next) next = sessionStorage.getItem("sa247_auth_next") || "";
        sessionStorage.removeItem("sa247_auth_next");
      } catch (_) {}
      const type = hash.get("type") || params.get("type");
      const code = params.get("code");
      const errDesc =
        params.get("error_description") ||
        hash.get("error_description") ||
        params.get("error") ||
        hash.get("error");

      if (errDesc) {
        msg.textContent = decodeURIComponent(errDesc.replace(/\+/g, " "));
        setTimeout(() => {
          location.replace("login.html");
        }, 2500);
        return;
      }

      // PKCE / Google OAuth: trao đổi ?code= lấy session
      if (code) {
        try {
          const { error } = await sb.auth.exchangeCodeForSession(code);
          if (error) console.warn("[SA247] exchangeCode", error.message);
        } catch (e) {
          console.warn("[SA247] exchangeCode", e);
        }
      }

      let session = null;
      for (let i = 0; i < 10; i++) {
        session = await sa247Auth.getSession();
        if (session) break;
        await sleep(200);
      }

      const isRecovery =
        type === "recovery" ||
        type === "invite" ||
        type === "signup" ||
        (next && next.includes("recovery=1")) ||
        (next && next.includes("activate=1")) ||
        (next && next.includes("doi-mat-khau"));

      if (!session) {
        msg.textContent =
          "Không lấy được phiên đăng nhập. Thử đăng nhập hoặc dùng lại link trong email.";
        setTimeout(() => {
          location.replace("login.html");
        }, 1800);
        return;
      }

      await syncGoogleProfile(session);

      msg.textContent = isRecovery
        ? "Xác nhận thành công. Chuyển tới thiết lập mật khẩu…"
        : "Xác nhận thành công. Đang vào tài khoản…";

      if (isRecovery) {
        const activate =
          type === "invite" ||
          type === "signup" ||
          (next && next.includes("activate=1"));
        location.replace(
          activate
            ? "doi-mat-khau.html?recovery=1&activate=1"
            : "doi-mat-khau.html?recovery=1"
        );
        return;
      }
      if (next && !/^https?:/i.test(next) && !/dashboard\/?$/i.test(next)) {
        location.replace(next);
        return;
      }
      location.replace(await sa247Auth.homeAfterLogin(next, session));
    });
  </script>
</body>
</html>
