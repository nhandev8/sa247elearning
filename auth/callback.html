<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth callback · SA247</title>
  <link rel="stylesheet" href="../assets/site.css" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đang xác thực…</h1>
    <p class="lead" id="msg">Vui lòng chờ trong giây lát.</p>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const msg = document.getElementById("msg");
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Thiếu supabase config.";
        return;
      }
      await sa247Auth.ensureClient();
      // PKCE / hash recovery: client detects session from URL
      const session = await sa247Auth.getSession();
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const next = params.get("next") || hash.get("next");
      const type = hash.get("type") || params.get("type");
      const isRecovery =
        type === "recovery" ||
        (next && next.includes("recovery=1")) ||
        (next && next.includes("doi-mat-khau"));

      if (!session) {
        msg.textContent = "Không lấy được phiên đăng nhập. Thử đăng nhập lại.";
        setTimeout(() => { location.replace("login.html"); }, 1200);
        return;
      }

      if (isRecovery) {
        location.replace("doi-mat-khau.html?recovery=1");
        return;
      }
      if (next && !/^https?:/i.test(next)) {
        location.replace(next);
        return;
      }
      location.replace("../dashboard/");
    });
  </script>
</body>
</html>
