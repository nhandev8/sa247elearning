<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xác thực · SA247</title>
  <link rel="stylesheet" href="../assets/site.css?v=20260926g2" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js?v=20260926g2" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đang xác thực…</h1>
    <p class="lead" id="msg">Vui lòng chờ trong giây lát.</p>
  </main>
  <script>
    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function pickDisplayName(user) {
      const meta = user?.user_metadata || {};
      return (
        meta.full_name ||
        meta.name ||
        [meta.given_name, meta.family_name].filter(Boolean).join(" ") ||
        ""
      ).trim();
    }

    function pickAvatar(user) {
      const meta = user?.user_metadata || {};
      return (meta.avatar_url || meta.picture || "").trim();
    }

    function isSafeNext(next) {
      if (!next || /^https?:/i.test(next)) return false;
      if (next.includes("://")) return false;
      return true;
    }

    function isFirstGoogleLogin(user) {
      if (!user?.created_at) return false;
      const created = Date.parse(user.created_at);
      const last = Date.parse(user.last_sign_in_at || user.created_at);
      if (!Number.isFinite(created) || !Number.isFinite(last)) return false;
      return Math.abs(last - created) < 120000;
    }

    async function hasAnyEnrollment(session) {
      try {
        const sb = await sa247Auth.ensureClient();
        const uid = session?.user?.id;
        if (!uid) return false;
        const { data, error } = await sb
          .from("enrollments")
          .select("id")
          .eq("user_id", uid)
          .eq("status", "active")
          .limit(1);
        if (error) return false;
        return Array.isArray(data) && data.length > 0;
      } catch (_) {
        return false;
      }
    }

    async function syncGoogleProfile(session) {
      try {
        const user = session?.user;
        if (!user?.id) return;
        const name = pickDisplayName(user);
        const avatar = pickAvatar(user);
        const profile = await sa247Auth.getProfile({ session, timeoutMs: 1200 });
        const patch = {};
        if (name && !(profile?.full_name && String(profile.full_name).trim())) {
          patch.full_name = name;
        }
        if (avatar && !(profile?.avatar_url && String(profile.avatar_url).trim())) {
          patch.avatar_url = avatar;
        }
        if (Object.keys(patch).length) await sa247Auth.updateProfile(patch);
      } catch (e) {
        console.warn("[SA247] syncGoogleProfile", e);
      }
    }

    function mapOauthError(errDesc) {
      const raw = decodeURIComponent(String(errDesc || "").replace(/\+/g, " ")).toLowerCase();
      if (raw.includes("access_denied") || raw.includes("cancel")) {
        return "Bạn đã hủy đăng nhập bằng Google.";
      }
      if (raw.includes("banned") || raw.includes("disabled")) {
        return "Tài khoản của bạn hiện không thể đăng nhập. Vui lòng liên hệ SA247.";
      }
      return "Không thể đăng nhập bằng Google. Vui lòng thử lại.";
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const msg = document.getElementById("msg");
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Thiếu supabase config.";
        return;
      }

      const sb = await sa247Auth.ensureClient();
      const params = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      let next = params.get("next") || hash.get("next");
      try {
        if (!next) next = sessionStorage.getItem("sa247_auth_next") || "";
        sessionStorage.removeItem("sa247_auth_next");
      } catch (_) {}

      const type = hash.get("type") || params.get("type");
      const code = params.get("code");
      const errDesc =
        params.get("error_description") ||
        hash.get("error_description") ||
        params.get("error") ||
        hash.get("error");

      if (errDesc) {
        msg.textContent = mapOauthError(errDesc);
        setTimeout(() => location.replace("login.html"), 2200);
        return;
      }

      if (code) {
        try {
          const { error } = await sb.auth.exchangeCodeForSession(code);
          if (error) console.warn("[SA247] exchangeCode", error.message);
        } catch (e) {
          console.warn("[SA247] exchangeCode", e);
        }
      }

      let session = null;
      for (let i = 0; i < 10; i++) {
        session = await sa247Auth.getSession();
        if (session) break;
        await sleep(200);
      }

      const isRecovery =
        type === "recovery" ||
        type === "invite" ||
        type === "signup" ||
        (next && next.includes("recovery=1")) ||
        (next && next.includes("activate=1")) ||
        (next && next.includes("doi-mat-khau"));

      if (!session) {
        msg.textContent = "Không thể đăng nhập bằng Google. Vui lòng thử lại.";
        setTimeout(() => location.replace("login.html"), 1800);
        return;
      }

      // Đồng bộ hồ sơ — không đụng enrollments / progress / chứng nhận
      await syncGoogleProfile(session);

      if (isRecovery) {
        msg.textContent = "Xác nhận thành công. Chuyển tới thiết lập mật khẩu…";
        const activate =
          type === "invite" ||
          type === "signup" ||
          (next && next.includes("activate=1"));
        location.replace(
          activate
            ? "doi-mat-khau.html?recovery=1&activate=1"
            : "doi-mat-khau.html?recovery=1"
        );
        return;
      }

      msg.textContent = "Đăng nhập thành công. Đang vào tài khoản…";

      if (isSafeNext(next) && !/dashboard\/?$/i.test(next)) {
        location.replace(next);
        return;
      }

      const enrolled = await hasAnyEnrollment(session);
      if (!enrolled && isFirstGoogleLogin(session.user)) {
        location.replace("../tim-khoa/?welcome=1");
        return;
      }

      location.replace(await sa247Auth.homeAfterLogin(next, session));
    });
  </script>
</body>
</html>
