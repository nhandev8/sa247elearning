<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · SA247 E-Learning</title>
  <link rel="stylesheet" href="../assets/site.css" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đăng nhập</h1>
    <form id="login-form" class="order-form">
      <label>Email
        <input name="email" type="email" required autocomplete="email" />
      </label>
      <label>Mật khẩu
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn btn--amber" type="submit" id="login-btn">Đăng nhập</button>
      <p class="form-msg" id="msg" role="status"></p>
    </form>
    <p><a href="register.html">Tạo tài khoản</a> · <a href="quen-mat-khau.html">Quên mật khẩu</a> · <a href="../index.html">Về trang chủ</a></p>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById("msg");
      const btn = document.getElementById("login-btn");
      msg.textContent = "Đang đăng nhập…";
      btn.disabled = true;
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Chưa cấu hình Supabase (URL + anon key).";
        btn.disabled = false;
        return;
      }
      try {
        // Warm client while user types is ideal; ensure before sign-in
        await sa247Auth.ensureClient();
        const { error } = await sa247Auth.signIn(fd.get("email"), fd.get("password"));
        if (error) {
          msg.textContent = error.message;
          btn.disabled = false;
          return;
        }
        msg.textContent = "Đang chuyển…";
        const next = new URLSearchParams(location.search).get("next");
        const dest = await sa247Auth.homeAfterLogin(next);
        location.replace(dest);
      } catch (err) {
        msg.textContent = err?.message || "Đăng nhập lỗi. Thử lại.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
