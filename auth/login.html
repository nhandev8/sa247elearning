<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · SA247 E-Learning</title>
  <link rel="stylesheet" href="../assets/site.css" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đăng nhập</h1>
    <p class="lead">Checkpoint 2 — tài khoản học viên (Email + mật khẩu).</p>
    <form id="login-form" class="order-form">
      <label>Email
        <input name="email" type="email" required autocomplete="email" />
      </label>
      <label>Mật khẩu
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn btn--amber" type="submit">Đăng nhập</button>
      <p class="form-msg" id="msg" role="status"></p>
    </form>
    <p><a href="register.html">Tạo tài khoản</a> · <a href="../index.html">Về trang chủ</a></p>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById("msg");
      msg.textContent = "Đang đăng nhập…";
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Chưa cấu hình Supabase (URL + anon key).";
        return;
      }
      const { error } = await sa247Auth.signIn(fd.get("email"), fd.get("password"));
      if (error) {
        msg.textContent = error.message;
        return;
      }
      const next = new URLSearchParams(location.search).get("next") || "../dashboard/";
      location.href = next;
    });
  </script>
</body>
</html>
