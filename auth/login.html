<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · SA247 E-Learning</title>
  <link rel="stylesheet" href="../assets/site.css?v=20260926google" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js?v=20260926google" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đăng nhập</h1>

    <button type="button" class="btn btn--google" id="btn-google" aria-label="Đăng nhập bằng Google">
      <span class="btn--google__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 48 48" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      </span>
      Đăng nhập bằng Google
    </button>
    <p class="auth-divider" role="presentation"><span>hoặc dùng email</span></p>

    <form id="login-form" class="order-form">
      <label>Email
        <input name="email" id="login-email" type="email" required autocomplete="email" />
      </label>
      <label>Mật khẩu
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn btn--amber" type="submit" id="login-btn">Đăng nhập</button>
      <p class="form-msg" id="msg" role="status"></p>
    </form>
    <p>
      <a href="register.html">Tạo tài khoản</a>
      ·
      <a href="quen-mat-khau.html" id="link-forgot">Quên mật khẩu</a>
      ·
      <a href="../index.html">Về trang chủ</a>
    </p>
  </main>
  <script>
    (function prefillEmail() {
      const q = new URLSearchParams(location.search).get("email");
      const input = document.getElementById("login-email");
      if (q && input) input.value = q;
      const forgot = document.getElementById("link-forgot");
      if (forgot) {
        const sync = () => {
          const v = (input?.value || "").trim();
          forgot.href = v
            ? "quen-mat-khau.html?email=" + encodeURIComponent(v)
            : "quen-mat-khau.html";
        };
        input?.addEventListener("input", sync);
        sync();
      }
    })();

    document.addEventListener("DOMContentLoaded", () => {
      if (window.sa247Auth?.ready) sa247Auth.ensureClient().catch(() => {});
    });

    function go(url) {
      try {
        location.replace(url);
      } catch {
        location.href = url;
      }
    }

    function authNext() {
      return new URLSearchParams(location.search).get("next") || "";
    }

    document.getElementById("btn-google").addEventListener("click", async () => {
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn-google");
      msg.textContent = "Đang chuyển tới Google…";
      btn.disabled = true;
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Chưa cấu hình Supabase (URL + anon key).";
        btn.disabled = false;
        return;
      }
      try {
        const { data, error } = await sa247Auth.signInWithGoogle({ next: authNext() });
        if (error) {
          msg.textContent = error.message || "Không mở được Google đăng nhập.";
          btn.disabled = false;
          return;
        }
        if (data?.url) {
          location.href = data.url;
          return;
        }
        msg.textContent = "Không nhận được URL Google. Kiểm tra provider Google trên Supabase.";
        btn.disabled = false;
      } catch (err) {
        msg.textContent = err?.message || "Đăng nhập Google lỗi.";
        btn.disabled = false;
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById("msg");
      const btn = document.getElementById("login-btn");
      msg.textContent = "Đang đăng nhập…";
      btn.disabled = true;
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Chưa cấu hình Supabase (URL + anon key).";
        btn.disabled = false;
        return;
      }

      const next = authNext();
      const fallback = next && !/dashboard\/?$/i.test(next) ? next : "../dashboard/";
      const hardTimer = setTimeout(() => go(fallback), 1200);

      const email = String(fd.get("email") || "").trim();
      try {
        const sb = await sa247Auth.ensureClient();
        try {
          const gate = await sb.rpc("login_gate", { p_email: email });
          if (!gate.error && gate.data && gate.data.allowed === false) {
            clearTimeout(hardTimer);
            const sec = Number(gate.data.retry_after_sec) || 60;
            msg.textContent = "Đăng nhập sai quá nhiều lần. Thử lại sau khoảng " + Math.ceil(sec / 60) + " phút.";
            btn.disabled = false;
            return;
          }
        } catch (_) {}
        const { data, error } = await sa247Auth.signIn(email, fd.get("password"));
        if (error) {
          clearTimeout(hardTimer);
          try { await sb.rpc("login_record", { p_email: email, p_ok: false }); } catch (_) {}
          msg.textContent = "Email hoặc mật khẩu không đúng.";
          btn.disabled = false;
          return;
        }
        try { await sb.rpc("login_record", { p_email: email, p_ok: true }); } catch (_) {}
        msg.textContent = "Đang chuyển…";
        const dest = await Promise.race([
          sa247Auth.homeAfterLogin(next, data?.session),
          new Promise((resolve) => setTimeout(() => resolve(fallback), 900)),
        ]);
        clearTimeout(hardTimer);
        go(dest || fallback);
      } catch (err) {
        clearTimeout(hardTimer);
        msg.textContent = err?.message || "Đăng nhập lỗi. Thử lại.";
        btn.disabled = false;
        setTimeout(() => go(fallback), 400);
      }
    });
  </script>
</body>
</html>
