<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · SA247 E-Learning</title>
  <link rel="stylesheet" href="../assets/site.css" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth-box">
    <p class="kicker">SA247 E-Learning</p>
    <h1>Đăng nhập</h1>
    <form id="login-form" class="order-form">
      <label>Email
        <input name="email" id="login-email" type="email" required autocomplete="email" />
      </label>
      <label>Mật khẩu
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn btn--amber" type="submit" id="login-btn">Đăng nhập</button>
      <p class="form-msg" id="msg" role="status"></p>
    </form>
    <p>
      <a href="register.html">Tạo tài khoản</a>
      ·
      <a href="quen-mat-khau.html" id="link-forgot">Quên mật khẩu</a>
      ·
      <a href="../index.html">Về trang chủ</a>
    </p>
  </main>
  <script>
    (function prefillEmail() {
      const q = new URLSearchParams(location.search).get("email");
      const input = document.getElementById("login-email");
      if (q && input) input.value = q;
      const forgot = document.getElementById("link-forgot");
      if (forgot) {
        const sync = () => {
          const v = (input?.value || "").trim();
          forgot.href = v
            ? "quen-mat-khau.html?email=" + encodeURIComponent(v)
            : "quen-mat-khau.html";
        };
        input?.addEventListener("input", sync);
        sync();
      }
    })();

    // Warm Supabase client sớm — tránh chậm lúc bấm Đăng nhập
    document.addEventListener("DOMContentLoaded", () => {
      if (window.sa247Auth?.ready) sa247Auth.ensureClient().catch(() => {});
    });

    function go(url) {
      try {
        location.replace(url);
      } catch {
        location.href = url;
      }
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById("msg");
      const btn = document.getElementById("login-btn");
      msg.textContent = "Đang đăng nhập…";
      btn.disabled = true;
      if (!window.sa247Auth?.ready) {
        msg.textContent = "Chưa cấu hình Supabase (URL + anon key).";
        btn.disabled = false;
        return;
      }

      const next = new URLSearchParams(location.search).get("next");
      const fallback = next && !/dashboard\/?$/i.test(next) ? next : "../dashboard/";
      // Failsafe: luôn chuyển trang trong ≤1.2s dù profile treo
      const hardTimer = setTimeout(() => go(fallback), 1200);

      try {
        await sa247Auth.ensureClient();
        const { data, error } = await sa247Auth.signIn(fd.get("email"), fd.get("password"));
        if (error) {
          clearTimeout(hardTimer);
          msg.textContent = error.message;
          btn.disabled = false;
          return;
        }
        msg.textContent = "Đang chuyển…";
        const dest = await Promise.race([
          sa247Auth.homeAfterLogin(next, data?.session),
          new Promise((resolve) => setTimeout(() => resolve(fallback), 900)),
        ]);
        clearTimeout(hardTimer);
        go(dest || fallback);
      } catch (err) {
        clearTimeout(hardTimer);
        msg.textContent = err?.message || "Đăng nhập lỗi. Thử lại.";
        btn.disabled = false;
        // Vẫn cố vào trang đích nếu đã có session
        setTimeout(() => go(fallback), 400);
      }
    });
  </script>
</body>
</html>
