<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phản hồi & Hỗ trợ · SA247</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/site.css?v=202610030015" />
  <script src="../assets/supabase-config.js?v=202610030015"></script>
  <script src="../assets/js/supabase-client.js?v=202610030015" defer></script>
  <script src="../assets/js/learner-nav.js?v=202610030015" defer></script>
  <script src="../assets/js/learner-boot.js?v=202610030015" defer></script>
  <script src="../assets/js/sa247-feedback.js?v=202610030015" defer></script>
  <script src="../assets/js/phan-hoi.js?v=202610030015" defer></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="app-side" aria-label="Menu học viên">
      <a class="app-side__brand" href="../index.html">SA247 <em>Learn</em></a>
      <nav class="app-side__nav" data-learner-nav data-active="phan-hoi"></nav>
      <div class="app-side__foot">
        <p class="app-side__user" id="user-label">…</p>
        <button type="button" class="btn btn--line btn--small" id="logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-top">
        <button type="button" class="app-menu-btn" id="menu-toggle" aria-label="Mở menu">☰</button>
        <h1>Phản hồi & Hỗ trợ</h1>
      </header>
      <main class="app-content learn-page">
        <header class="learn-head">
          <p class="learn-welcome">Gửi phản hồi, báo lỗi hoặc góp ý</p>
          <p class="learn-head__sub">Kiến thức HSE phải chính xác. Nếu bạn phát hiện điều gì chưa đúng, hãy phản hồi để SA247 cùng bạn cải thiện.</p>
          <p style="margin-top:1rem"><button type="button" class="btn btn--amber" id="new-feedback">+ Gửi phản hồi mới</button></p>
        </header>
        <section class="app-section learn-section">
          <div class="learn-section__head"><h2>Phản hồi của bạn</h2></div>
          <p class="meta" id="fb-status">Đang tải…</p>
          <div id="fb-list" class="fb-list"></div>
        </section>
      </main>
    </div>
  </div>
  <style>
    .fb-list{display:grid;gap:.85rem;margin-top:.5rem}
    .fb-card{border:1px solid #e5e7eb;border-radius:14px;padding:1rem 1.15rem;background:#fff}
    .fb-card h3{margin:0 0 .35rem;font-size:1.02rem}
    .fb-card .fb-meta{color:#64748b;font-size:.85rem;margin:0 0 .5rem}
    .fb-card p{margin:0;color:#334155;line-height:1.5}
    .fb-badge{display:inline-block;font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;margin-right:.35rem}
    .fb-badge--open{background:#fef3c7;color:#92400e}
    .fb-badge--prog{background:#dbeafe;color:#1e40af}
    .fb-badge--done{background:#dcfce7;color:#166534}
    .fb-resolution{margin-top:.6rem;padding:.6rem .8rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;color:#166534;font-size:.9rem}
  </style>
</body>
</html>
