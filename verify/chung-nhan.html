<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giấy chứng nhận · SA247</title>
  <meta name="description" content="Giấy chứng nhận SA247 — form mẫu trưng bày thiết kế; giấy đã cấp chỉ mở bằng mã hệ thống sinh." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/certificate.css" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" defer></script>
  <script src="../assets/js/certificate.js" defer></script>
</head>
<body>
  <header class="cert-toolbar no-print">
    <div>
      <strong>Giấy chứng nhận SA247</strong>
      <span id="toolbar-code" style="opacity:0.75;margin-left:0.5rem"></span>
    </div>
    <div class="cert-toolbar__actions">
      <button type="button" class="btn btn--amber" id="btn-print">In / Lưu PDF</button>
      <a class="btn btn--line" id="btn-verify" href="./">Xác minh mã</a>
      <a class="btn btn--line" href="../index.html">Về trang chủ</a>
    </div>
  </header>

  <p class="cert-status" id="cert-status" role="status">Đang tải giấy chứng nhận…</p>

  <!-- Form mẫu trưng bày (khi ?sample=) -->
  <div class="cert-stage" id="showcase-stage" hidden>
    <figure class="cert-showcase">
      <img id="showcase-img" src="" alt="Mẫu giấy chứng nhận SA247" />
    </figure>
  </div>

  <!-- Phôi in + trường động -->
  <div class="cert-stage" id="cert-stage" hidden>
    <article class="cert-sheet" id="certificate" aria-label="Giấy chứng nhận hoàn thành khóa học">
      <img class="cert-sheet__phoi" id="cert-phoi" alt="" />
      <div class="cert-field cert-field--name" id="cert-name">—</div>
      <div class="cert-field cert-field--code-cover" aria-hidden="true"></div>
      <div class="cert-field cert-field--code" id="cert-code">—</div>
      <div class="cert-field cert-field--date" id="cert-date">—</div>
      <div class="cert-field cert-field--qr" id="cert-qr" aria-label="Mã QR xác minh chứng nhận"></div>
    </article>
  </div>
</body>
</html>
