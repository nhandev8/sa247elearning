<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kỳ thi cuối khóa · SA247</title>
  <meta name="description" content="Làm bài kiểm tra cuối khóa SA247 — đạt điều kiện để hệ thống cấp chứng nhận." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/site.css" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js" defer></script>
  <script src="../assets/js/app-shell.js" defer></script>
  <script src="../assets/js/quiz.js" defer></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="app-side" aria-label="Menu học viên">
      <a class="app-side__brand" href="../index.html">SA247 <em>Learn</em></a>
      <nav class="app-side__nav">
        <a href="../index.html"><span class="ico" aria-hidden="true">⌂</span>Trang chủ</a>
        <a href="../dashboard/"><span class="ico" aria-hidden="true">▣</span>Khóa học của tôi</a>
        <a class="is-active" href="./"><span class="ico" aria-hidden="true">✓</span>Kỳ thi</a>
        <a href="../chung-nhan/"><span class="ico" aria-hidden="true">◎</span>Chứng nhận của tôi</a>
        <a href="../verify/"><span class="ico" aria-hidden="true">⌕</span>Xác minh công khai</a>
      </nav>
      <div class="app-side__foot">
        <p class="app-side__user" id="user-label">…</p>
        <a class="btn btn--line btn--small" href="../auth/login.html">Đăng nhập</a>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-top">
        <button type="button" class="app-menu-btn" id="menu-toggle" aria-label="Mở menu">☰</button>
        <h1>Kỳ thi cuối khóa</h1>
      </header>
      <main class="app-content">
        <div id="quiz-course-wrap" class="quiz-course-wrap" hidden>
          <label>
            Chọn khóa đã mở khóa
            <select id="quiz-course"></select>
          </label>
        </div>
        <p class="lead" id="quiz-status">Đang tải…</p>
        <form id="quiz-form" class="quiz-form" hidden>
          <label class="quiz-name">
            Họ tên trên chứng nhận
            <input type="text" name="full_name" required maxlength="120" placeholder="VD: Nguyễn Văn A" />
          </label>
          <div id="quiz-questions"></div>
          <button type="submit" class="btn btn--amber">Nộp bài</button>
        </form>
        <div id="quiz-result" class="quiz-result" hidden></div>
      </main>
    </div>
  </div>
</body>
</html>
