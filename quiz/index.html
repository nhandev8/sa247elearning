<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kỳ thi cuối khóa · SA247</title>
  <meta name="description" content="Làm bài kiểm tra cuối khóa SA247 — đạt điều kiện để hệ thống cấp chứng nhận." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/site.css?v=20260915ui2" />
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/js/supabase-client.js?v=20260915hs" defer></script>
  <script src="../assets/js/app-shell.js" defer></script>
  <script src="../assets/js/quiz.js?v=20260915hs" defer></script>
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="app-side" aria-label="Menu học viên">
      <a class="app-side__brand" href="../index.html">SA247 <em>Learn</em></a>
      <nav class="app-side__nav">
        <a href="../dashboard/">Học tập</a>
        <a href="../ho-so/">Hồ sơ</a>
        <a class="is-active" href="./">Kỳ thi</a>
        <a href="../chung-nhan/">Chứng nhận</a>
        <a href="../verify/">Xác minh</a>
        <a href="../index.html">Trang chủ</a>
      </nav>
      <div class="app-side__foot">
        <p class="app-side__user" id="user-label">…</p>
        <a class="btn btn--line btn--small" href="../auth/login.html">Đăng nhập</a>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-top">
        <button type="button" class="app-menu-btn" id="menu-toggle" aria-label="Mở menu">☰</button>
        <h1>Kỳ thi cuối khóa</h1>
      </header>
      <main class="app-content">
        <div id="quiz-course-wrap" class="quiz-course-wrap" hidden>
          <label>
            Chọn khóa đã mở khóa
            <select id="quiz-course"></select>
          </label>
        </div>
        <p class="lead" id="quiz-status">Đang tải…</p>
        <form id="quiz-form" class="quiz-form" hidden>
          <fieldset class="quiz-cert-name">
            <legend>Kiểm tra thông tin trên chứng nhận</legend>
            <label class="quiz-name">
              Họ và tên
              <input type="text" name="full_name" id="quiz-full-name" required maxlength="120" placeholder="VD: Nguyễn Văn A" />
            </label>
            <label class="quiz-confirm checkout-terms">
              <input type="checkbox" name="confirm_cert_name" id="confirm-cert-name" required />
              <span>Tôi xác nhận thông tin trên là chính xác để in trên giấy chứng nhận.</span>
            </label>
            <p class="meta" id="quiz-cert-lock-note" hidden>Bạn đã có GCN phát hành — tên trên chứng nhận đã khóa theo hồ sơ.</p>
          </fieldset>
          <div id="quiz-questions"></div>
          <button type="submit" class="btn btn--amber">Nộp bài</button>
        </form>
        <div id="quiz-result" class="quiz-result" hidden></div>
      </main>
    </div>
  </div>
</body>
</html>
