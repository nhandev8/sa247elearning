<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài kiểm tra · SA247 Quản trị</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/admin.css" />
  <script src="../../assets/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js" defer></script>
  <script src="../../assets/js/admin-api.js" defer></script>
  <script src="../../assets/js/admin-shell.js" defer></script>
  <script src="../../assets/js/admin-bai-kiem-tra.js" defer></script>
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-side">
      <a class="adm-side__brand" href="../">SA247 <em>Quản trị</em></a>
      <nav class="adm-nav" id="adm-side-nav"></nav>
      <div class="adm-side__foot">
        <p class="adm-side__user" id="adm-user">…</p>
        <button type="button" class="adm-btn adm-btn--line adm-btn--small" id="adm-logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="adm-main">
      <header class="adm-top">
        <button type="button" class="adm-menu-btn" id="adm-menu-toggle">☰</button>
        <h1>Bài kiểm tra</h1>
      </header>
      <main class="adm-content">
        <p class="adm-msg" id="adm-status"></p>
        <section class="adm-card" style="margin-bottom:1rem">
          <h2>Tạo bài kiểm tra</h2>
          <form class="adm-form" id="add-form">
            <label>Khóa học <select name="course_id" id="form-course" required></select></label>
            <label>Tiêu đề <input name="title" required placeholder="Bài kiểm tra cuối khóa" /></label>
            <label>Điểm đạt (%) <input name="pass_percent" type="number" value="70" min="0" max="100" /></label>
            <label>Số lần làm tối đa <input name="max_attempts" type="number" value="3" min="1" /></label>
            <div><strong>Chọn câu hỏi từ ngân hàng</strong></div>
            <div id="q-pick" class="adm-form"></div>
            <button type="submit" class="adm-btn adm-btn--primary">Tạo bài kiểm tra</button>
          </form>
          <p class="adm-msg" id="form-msg"></p>
        </section>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Tiêu đề</th>
                <th>Khóa</th>
                <th>Điểm đạt</th>
                <th>Lần làm</th>
                <th>Số câu</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
