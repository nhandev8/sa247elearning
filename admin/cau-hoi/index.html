<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ngân hàng câu hỏi · SA247 Quản trị</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/admin.css" />
  <script src="../../assets/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js" defer></script>
  <script src="../../assets/js/admin-api.js" defer></script>
  <script src="../../assets/js/admin-shell.js" defer></script>
  <script src="../../assets/js/admin-cau-hoi.js?v=20260920v2" defer></script>
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-side">
      <a class="adm-side__brand" href="../">SA247 <em>Quản trị</em></a>
      <nav class="adm-nav" id="adm-side-nav"></nav>
      <div class="adm-side__foot">
        <p class="adm-side__user" id="adm-user">…</p>
        <button type="button" class="adm-btn adm-btn--line adm-btn--small" id="adm-logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="adm-main">
      <header class="adm-top">
        <button type="button" class="adm-menu-btn" id="adm-menu-toggle">☰</button>
        <h1>Ngân hàng câu hỏi</h1>
      </header>
      <main class="adm-content">
        <div class="adm-toolbar">
          <select id="filter-course"><option value="">Tất cả khóa</option></select>
          <select id="filter-scope">
            <option value="">Mọi scope</option>
            <option value="chuong">Chương</option>
            <option value="khoa">Khóa</option>
          </select>
          <select id="filter-module"><option value="">Tất cả chương</option></select>
        </div>
        <p class="adm-msg" id="adm-status"></p>

        <section class="adm-card" style="margin-bottom:1rem">
          <h2>Import JSON theo lô</h2>
          <p class="meta">Dán đúng định dạng <code>content/quiz/&lt;COURSE&gt;/*.json</code> (có <code>questions[]</code> + <code>answer</code>). Ưu tiên seed bằng <code>scripts/seed_quiz_bank.py</code> khi có file nguồn.</p>
          <form class="adm-form" id="import-form">
            <label>Khóa (tuỳ chọn nếu JSON có course_code)
              <select id="import-course"></select>
            </label>
            <label>Scope mặc định
              <select id="import-scope">
                <option value="chuong">chuong</option>
                <option value="khoa">khoa</option>
              </select>
            </label>
            <label>Chương mặc định <select id="import-module"></select></label>
            <label>JSON<textarea id="import-json" rows="8" placeholder='{ "course_code":"AL-01", "scope":"chuong", "module_code":"M01", "questions":[…] }'></textarea></label>
            <label><input type="checkbox" id="import-dry" /> Dry-run (không ghi DB)</label>
            <button type="submit" class="adm-btn adm-btn--primary">Import</button>
          </form>
          <p class="adm-msg" id="import-msg"></p>
        </section>

        <section class="adm-card" style="margin-bottom:1rem">
          <h2>Thêm câu hỏi</h2>
          <form class="adm-form" id="add-form">
            <label>Khóa học <select name="course_id" id="form-course" required></select></label>
            <label>Scope
              <select name="scope" id="form-scope">
                <option value="chuong" selected>Cuối chương</option>
                <option value="khoa">Cuối khóa</option>
              </select>
            </label>
            <label id="form-module-wrap">Chương <select name="module_code" id="form-module"></select></label>
            <label>Mã câu (external_code) <input name="external_code" placeholder="AL01-M01-Q01" /></label>
            <label>source_ref <input name="source_ref" placeholder="AL-01-M01-B01/V01-S02" /></label>
            <label>Mức
              <select name="level">
                <option value="nho_hieu">Nhớ–hiểu</option>
                <option value="ap_dung">Áp dụng</option>
                <option value="phan_tich">Phân tích</option>
              </select>
            </label>
            <label>Chủ đề <input name="topic" placeholder="An toàn điện" /></label>
            <label>Câu hỏi <textarea name="stem" rows="3" required></textarea></label>
            <label>Lựa chọn A <input name="choice_0" required /></label>
            <label>Lựa chọn B <input name="choice_1" required /></label>
            <label>Lựa chọn C <input name="choice_2" required /></label>
            <label>Lựa chọn D <input name="choice_3" required /></label>
            <label>Đáp án đúng
              <select name="correct_index">
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2">C</option>
                <option value="3">D</option>
              </select>
            </label>
            <label>Giải thích <textarea name="explanation" rows="2"></textarea></label>
            <button type="submit" class="adm-btn adm-btn--primary">Thêm câu hỏi</button>
          </form>
          <p class="adm-msg" id="form-msg"></p>
        </section>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Khóa</th>
                <th>Scope</th>
                <th>Mức</th>
                <th>Câu hỏi</th>
                <th>Đáp án</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
