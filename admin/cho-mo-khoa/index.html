<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chờ mở khóa · SA247 Quản trị</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/admin.css?v=202609300210" />
  <script src="../../assets/supabase-config.js?v=202609300210"></script>
  <script src="../../assets/js/supabase-client.js?v=202609300210" defer></script>
  <script src="../../assets/js/admin-api.js?v=202609300210" defer></script>
  <script src="../../assets/js/admin-shell.js?v=202609300210" defer></script>
  <script src="../../assets/js/admin-cho-mo-khoa.js?v=202609300210" defer></script>
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-side">
      <a class="adm-side__brand" href="../">SA247 <em>Quản trị</em></a>
      <nav class="adm-nav" id="adm-side-nav"></nav>
      <div class="adm-side__foot">
        <p class="adm-side__user" id="adm-user">…</p>
        <button type="button" class="adm-btn adm-btn--line adm-btn--small" id="adm-logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="adm-main">
      <header class="adm-top">
        <button type="button" class="adm-menu-btn" id="adm-menu-toggle">☰</button>
        <h1>Đăng ký chờ mở khóa</h1>
      </header>
      <main class="adm-content">
        <p class="adm-msg">Người xem trang khóa sắp mở để lại thông tin nhận thông báo. Khi khóa mở: xuất CSV để gửi thông báo, rồi đánh dấu “Đã báo”.</p>
        <p class="adm-toolbar">
          <label>Khóa <select id="f-course"><option value="">Tất cả</option></select></label>
          <label>Trạng thái
            <select id="f-status">
              <option value="">Tất cả</option>
              <option value="moi">Mới</option>
              <option value="da_bao">Đã báo</option>
              <option value="da_dang_ky">Đã đăng ký khóa</option>
              <option value="huy">Hủy</option>
            </select>
          </label>
          <button type="button" class="adm-btn adm-btn--line" id="btn-csv">Xuất CSV</button>
          <button type="button" class="adm-btn adm-btn--line" id="btn-mark">Đánh dấu “Đã báo” (đang lọc)</button>
        </p>
        <p class="adm-msg" id="adm-status"></p>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Ngày</th>
                <th>Khóa</th>
                <th>Họ tên</th>
                <th>Liên hệ</th>
                <th>Vai trò</th>
                <th>Ghi chú</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
