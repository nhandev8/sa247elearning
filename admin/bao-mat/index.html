      <main class="adm-content">
        <p class="adm-msg">Sự kiện bảo mật do hệ thống tự ghi: đổi vai trò, vượt giới hạn tra cứu, nhập mã Campus thất bại, thi lại sau khi GCN bị thu hồi… Nhật ký chỉ được thêm, không sửa/xóa; tự xóa sau 24 tháng.</p>
