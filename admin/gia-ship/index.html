<!DOCTYPE html>
<html lang="vi">
<head>

<body class="adm-body">
  <div class="adm-shell">

      <a class="adm-side__brand" href="../">SA247 <em>Quản trị</em></a>
      <nav class="adm-nav" id="adm-side-nav"></nav>

        <p class="adm-toolbar">
          <button type="button" class="adm-btn adm-btn--line" id="sync-courses">Đồng bộ giá khóa = course_default</button>
