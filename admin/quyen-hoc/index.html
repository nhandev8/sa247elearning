<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý quyền học · SA247 Quản trị</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/admin.css?v=202610022345" />
  <script src="../../assets/supabase-config.js?v=202610022345"></script>
  <script src="../../assets/js/supabase-client.js?v=202610022345" defer></script>
  <script src="../../assets/js/admin-api.js?v=202610022345" defer></script>
  <script src="../../assets/js/admin-shell.js?v=202610022345" defer></script>
  <script src="../../assets/js/admin-learner-common.js?v=202610022345" defer></script>
  <script src="../../assets/js/admin-quyen-hoc.js?v=202610022345" defer></script>
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-side">
      <a class="adm-side__brand" href="../">SA247 <em>Quản trị</em></a>
      <nav class="adm-nav" id="adm-side-nav"></nav>
      <div class="adm-side__foot">
        <p class="adm-side__user" id="adm-user">…</p>
        <button type="button" class="adm-btn adm-btn--line adm-btn--small" id="adm-logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="adm-main">
      <header class="adm-top">
        <button type="button" class="adm-menu-btn" id="adm-menu-toggle">☰</button>
        <h1>Quản lý quyền học</h1>
      </header>
      <main class="adm-content">
        <p class="adm-lead">Quản lý toàn bộ quyền học của từng người học. Mỗi người học một dòng; mở hồ sơ để quản lý từng khóa.</p>

        <div class="adm-stats" id="enr-kpi">
          <div class="adm-stat"><strong id="kpi-people">—</strong><span>Người học có quyền</span></div>
          <div class="adm-stat"><strong id="kpi-active">—</strong><span>Đang hoạt động</span></div>
          <div class="adm-stat"><strong id="kpi-multi">—</strong><span>Có nhiều khóa học</span></div>
          <div class="adm-stat"><strong id="kpi-expiring">—</strong><span>Sắp hết hạn (14 ngày)</span></div>
        </div>

        <div class="adm-filters lrn-filters">
          <input type="search" id="q" placeholder="Tìm theo tên, email, số điện thoại…" />
          <select id="f-course" aria-label="Khóa học"><option value="">Tất cả khóa học</option></select>
          <select id="f-state" aria-label="Trạng thái quyền">
            <option value="">Mọi trạng thái quyền</option>
            <option value="active">Đang hoạt động</option>
            <option value="expiring">Sắp hết hạn</option>
            <option value="expired">Hết hạn</option>
            <option value="revoked">Đã thu hồi</option>
          </select>
          <select id="f-source" aria-label="Nguồn cấp">
            <option value="">Mọi nguồn cấp</option>
            <option value="mua_khoa">Mua khóa học</option>
            <option value="admin">Quản trị viên cấp</option>
            <option value="campus">SA247 Campus</option>
            <option value="khac">Khác</option>
          </select>
          <select id="f-term" aria-label="Thời hạn">
            <option value="">Mọi thời hạn</option>
            <option value="unlimited">Không thời hạn</option>
            <option value="limited">Có thời hạn</option>
          </select>
          <button type="button" class="adm-btn adm-btn--primary" id="enr-grant" data-commerce-only hidden>+ Cấp quyền học</button>
        </div>

        <p class="adm-msg" id="adm-status">Đang tải…</p>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead id="enr-head"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
