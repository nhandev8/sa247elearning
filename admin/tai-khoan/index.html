<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tất cả tài khoản · SA247 Quản trị</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/admin.css" />
  <script src="../../assets/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js" defer></script>
  <script src="../../assets/js/admin-api.js" defer></script>
  <script src="../../assets/js/admin-shell.js?v=20260916user" defer></script>
  <script src="../../assets/js/admin-tai-khoan.js?v=20260916user" defer></script>
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-side">
      <a class="adm-side__brand" href="../">SA247 <em>Quản trị</em></a>
      <nav class="adm-nav" id="adm-side-nav"></nav>
      <div class="adm-side__foot">
        <p class="adm-side__user" id="adm-user">…</p>
        <button type="button" class="adm-btn adm-btn--line adm-btn--small" id="adm-logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="adm-main">
      <header class="adm-top">
        <button type="button" class="adm-menu-btn" id="adm-menu-toggle">☰</button>
        <h1>Tất cả người dùng</h1>
      </header>
      <main class="adm-content">
        <div class="adm-toolbar">
          <input type="search" id="q" placeholder="Tìm họ tên / SĐT…" />
          <select id="filter">
            <option value="all">Tất cả</option>
            <option value="learner">Học viên</option>
            <option value="staff">Staff</option>
            <option value="quan_tri_cao_nhat">QT cao nhất</option>
            <option value="kinh_doanh">Kinh doanh</option>
            <option value="hoc_vien">hoc_vien</option>
          </select>
        </div>
        <p class="adm-msg" id="adm-status"></p>
        <div class="adm-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Họ tên</th>
                <th>Vai trò</th>
                <th>Điện thoại</th>
                <th>Ngày đăng ký</th>
                <th>Số quyền học</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="adm-lead">Bấm <strong>Mở hồ sơ</strong> để xem và thao tác toàn bộ: tài khoản, quyền học, tiến độ, kiểm tra, chứng nhận, đơn hàng.</p>
      </main>
    </div>
  </div>
</body>
</html>
